# EIRA lint baseline — start med kernereglerne (matches CI), udvid gradvist
target-version = "py311"
line-length = 110

[lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    "E501",  # line length — håndteres af rustfmt-stil senere
    "F403", "F405",  # wildcard imports i legacy-kode
]
unfixable = []

[lint.isort]
known-first-party = ["eira"]
