# EiraOS' sikkerhedsinvarianter (UDVIKLINGSPLAN F0c.3, vurderingen G-22).
#
# Hver invariant er en påstand fra SIKKERHEDSMODEL.md med det, der beviser den:
#
#   tests             tests, der kører med udviklingsstandarden (conftest:
#                     EIRA_ENV=development, sockets uden for /run/eira)
#   production_tests  tests, der selv sætter produktionstilstanden: et
#                     installeret system (installed(), EIRA_STRICT_DAEMON_IDENTITY,
#                     /run/eira-stier), en rigtig kerne-peer eller de installerede
#                     filer (units, profiler, pakke)
#   mutants           mutanter i tests/mutants/, som skal fanges
#   vm                checks i packaging/installer/ci/eira-ci-report, kørt på
#                     den installerede ISO
#   gap               hvad der ikke er bevist endnu
#
# En test skrives "fil::funktion" (eller "fil::Klasse::metode").
# scripts/invariant_matrix.py laver docs/reference/sikkerhedsinvarianter.md, og
# tests/test_security_invariants.py tjekker, at hver henvisning findes, og at
# alle GATE- og IPC-mutanter hører til en invariant.

