name: Ubuntu 24.04 Packaging Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/build_deb.sh"
      - "scripts/build_iso.sh"
      - "scripts/fetch_ubuntu_iso.sh"
      - "packaging/**"
      - "systemd/**"
      - "ui/**"
      - ".github/workflows/packaging-acceptance.yml"

permissions:
  contents: read

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper debhelper-compat dh-python python3-all python3-pytest python3-venv \
            nodejs npm libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            build-essential python3-dev cargo rustc \
            librsvg2-dev patchelf apparmor-utils python3-cryptography \
            python3-httpx python3-pydantic python3-websockets

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify build toolchain and AppArmor profiles
        run: |
          rustc --version
          cargo --version
          apparmor_parser --version
          sudo apparmor_parser -Q -K packaging/apparmor/usr.bin.eira-*

      - name: Build Debian package
        env:
          EIRA_DPKG_SKIP_BUILD_DEPS_CHECK: "1"
        run: scripts/build_deb.sh --output-dir dist

      - name: Inspect package metadata and payload
        run: |
          dpkg-deb --info dist/eira-os-core.deb
          dpkg-deb --contents dist/eira-os-core.deb | tee dist/eira-os-core.contents.txt
          dpkg-deb --field dist/eira-os-core.deb Package Version Architecture Depends
          dpkg-deb --contents dist/eira-os-core.deb | grep -E 'eira-(stated|identityd|fleetd|veritasd|intentd|graphd|spatial-desktop|session)'
          python3 - <<'PY' > dist/eira-os-core.deb.sha3-256
          import hashlib, pathlib
          p = pathlib.Path("dist/eira-os-core.deb")
          h = hashlib.sha3_256(p.read_bytes()).hexdigest()
          print(f"{h}  {p.name}")
          PY

      - name: Upload Debian package and inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: eira-deb-ubuntu-24.04
          path: |
            dist/eira-os-core.deb
            dist/eira-os-core.contents.txt
            dist/eira-os-core.deb.sha3-256
          if-no-files-found: error
          retention-days: 14

  build-installer-iso:
    needs: build-deb
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: eira-deb-ubuntu-24.04
          path: dist

      - name: Install ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso gnupg curl

      - name: Restore Ubuntu base ISO cache
        uses: actions/cache@v4
        with:
          path: .cache/ubuntu-iso
          key: ubuntu-24.04-live-server-${{ github.run_id }}
          restore-keys: ubuntu-24.04-live-server-

      - name: Fetch and verify Ubuntu 24.04 live-server ISO
        id: base
        run: echo "iso=$(scripts/fetch_ubuntu_iso.sh .cache/ubuntu-iso)" >> "$GITHUB_OUTPUT"

      - name: Build installable EiraOS ISO
        run: |
          scripts/build_iso.sh \
            --base-iso "${{ steps.base.outputs.iso }}" \
            --deb dist/eira-os-core.deb \
            --output-dir dist

      - name: Verify ISO layout and boot records
        run: |
          ISO=dist/EiraOS-1.0-RC1-amd64.iso
          test -s "$ISO"
          cat "$ISO.sha3-256"
          xorriso -indev "$ISO" -report_el_torito plain 2>/dev/null | tee dist/el-torito.txt
          grep -qi "El Torito boot img" dist/el-torito.txt
          xorriso -indev "$ISO" -report_system_area plain 2>/dev/null | tee dist/system-area.txt
          grep -q "GPT" dist/system-area.txt
          xorriso -indev "$ISO" -find / -type f 2>/dev/null > dist/iso-files.txt
          for f in /autoinstall.yaml /eira/eira-os-core.deb /eira/eira-postinstall.sh /eira/eira-firstboot /casper/vmlinuz; do
            grep -q "'$f'" dist/iso-files.txt || { echo "missing $f"; exit 1; }
          done

      - name: Upload ISO and provenance
        uses: actions/upload-artifact@v4
        with:
          name: eira-installer-iso-ubuntu-24.04-amd64
          path: |
            dist/EiraOS-1.0-RC1-amd64.iso
            dist/EiraOS-1.0-RC1-amd64.iso.sha3-256
            dist/EiraOS-1.0-RC1-amd64.iso.build-info.json
          if-no-files-found: error
          retention-days: 7
