name: Ubuntu 26.04 Packaging Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    # Everything that can change the installed system runs the acceptance:
    # app/** (the gate, IPC access), crates/** (the consent agent), the
    # packaging and the tests. Only documentation is skipped (UDVIKLINGSPLAN
    # F0c.1, review G-20). A list of included paths missed app/** before.
    paths-ignore:
      - "docs/**"
      - "specs/**"
      - "**/*.md"

permissions:
  contents: read

jobs:
  # The package is built on the target release so it links against
  # Ubuntu 26.04's libraries (WebKitGTK, glibc) and Python.
  build-deb:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 90
    steps:
      # Only for scripts/ci/apt-install.sh; git is not installed yet, so
      # this is a plain download. The real checkout follows below.
      - name: Fetch CI scripts
        uses: actions/checkout@v4

      - name: Install package build dependencies
        run: |
          # Retries, then a mirror outside ubuntu.com (scripts/ci/apt-install.sh).
          scripts/ci/apt-install.sh \
            ca-certificates curl git build-essential pkg-config file \
            debhelper dh-python python3-all python3-dev python3-pytest python3-venv python3-pip \
            nodejs npm libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev patchelf apparmor apparmor-utils xorriso \
            python3-cryptography python3-jsonschema python3-httpx python3-pydantic python3-websockets

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify build toolchain and AppArmor profiles
        run: |
          . /etc/os-release && echo "$PRETTY_NAME"
          rustc --version
          node --version
          apparmor_parser --version
          apparmor_parser -Q -K packaging/apparmor/usr.bin.eira-*

      # Compiler cache for the Tauri app and the consent agent (GitHub's
      # cache service); a miss only means a normal build.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build Debian package
        env:
          EIRA_DPKG_SKIP_BUILD_DEPS_CHECK: "1"
          # The test suites run in tests-on-ubuntu-26.04 (below), in parallel,
          # instead of inside the package build on the ISO's critical path.
          DEB_BUILD_OPTIONS: nocheck
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/build_deb.sh --output-dir dist

      - name: Inspect package metadata and payload
        run: |
          dpkg-deb --info dist/eira-os-core.deb
          dpkg-deb --contents dist/eira-os-core.deb | tee dist/eira-os-core.contents.txt
          dpkg-deb --field dist/eira-os-core.deb Package Version Architecture Depends
          for f in eira-stated eira-identityd eira-fleetd eira-veritasd eira-intentd eira-graphd \
                   eira-spatial-desktop eira-session wayland-sessions/eira-session.desktop \
                   share/eira-os/labwc/autostart; do
            grep -q "$f" dist/eira-os-core.contents.txt || { echo "missing $f"; exit 1; }
          done
          python3 - <<'PY' > dist/eira-os-core.deb.sha3-256
          import hashlib, pathlib
          p = pathlib.Path("dist/eira-os-core.deb")
          print(f"{hashlib.sha3_256(p.read_bytes()).hexdigest()}  {p.name}")
          PY

      - name: Upload Debian package and inspection evidence
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: eira-deb-ubuntu-26.04
          path: |
            dist/eira-os-core.deb
            dist/eira-os-core.contents.txt
            dist/eira-os-core.deb.sha3-256
          if-no-files-found: error
          retention-days: 14

  # The Python and UI test suites on Ubuntu 26.04's own Python and Node (the
  # interpreter the package runs on; python-ci covers 3.11/3.12). Formerly run
  # inside the package build, where they delayed the ISO by ~2 minutes.
  tests-on-ubuntu-26-04:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 30
    steps:
      - name: Fetch CI scripts
        uses: actions/checkout@v4

      # The same tools the package build had: some tests use cargo, make,
      # apparmor_parser and xorriso when present and skip without them.
      - name: Install Python, Node and the tools the tests use
        run: |
          scripts/ci/apt-install.sh ca-certificates curl git build-essential pkg-config libssl-dev \
            python3 python3-venv python3-pip nodejs npm apparmor xorriso swtpm tpm2-openssl

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Python tests
        run: |
          python3 --version
          python3 -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install -q -r requirements-dev.txt
          # The device key against 26.04's own tpm2-openssl (EIRA-CONTEXT §5.0).
          EIRA_TEST_REQUIRE_TPM=1 PYTHONPATH=. /tmp/venv/bin/python -m pytest -q tests

      # The Rust workspace includes the consent agent that is in the package.
      - name: Rust tests
        run: cargo test --workspace --all-features

      - name: UI tests
        run: |
          npm ci --prefix ui --ignore-scripts
          npm test --prefix ui

  # EiraOS' own labwc (>= 0.20.3, wlroots 0.20 static), built on the target
  # release. verify-globals.sh runs it headless and proves R-6.1 of
  # EIRA-CONSENT-AGENT: with EiraOS' rc.xml no client is offered a privileged
  # protocol (virtual pointer/keyboard, layer-shell, screencopy, ...).
  build-eira-labwc:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    # A slow fallback mirror can stretch the dependency install (apt-install.sh).
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # Retries, then a mirror outside ubuntu.com (scripts/ci/apt-install.sh).
          scripts/ci/apt-install.sh $(cat packaging/eira-labwc/build-deps) wayland-utils grim

      - name: Build eira-labwc
        run: packaging/eira-labwc/build.sh --output-dir dist

      - name: Verify no client is offered a privileged protocol (R-6.1)
        run: |
          mkdir -p /tmp/x && dpkg-deb -x dist/eira-labwc.deb /tmp/x
          useradd -m tester
          chmod -R a+rX "$GITHUB_WORKSPACE" /tmp/x
          runuser -u tester -- packaging/eira-labwc/verify-globals.sh \
            /tmp/x/usr/bin/labwc packaging/session/config/labwc
          # Mutation: one <allow> must make the check fail.
          mkdir -p /tmp/mut
          sed 's|<privilegedInterfaces></privilegedInterfaces>|<privilegedInterfaces><allow>zwlr_virtual_pointer_manager_v1</allow></privilegedInterfaces>|' \
            packaging/session/config/labwc/rc.xml > /tmp/mut/rc.xml
          chmod -R a+rX /tmp/mut
          if runuser -u tester -- packaging/eira-labwc/verify-globals.sh /tmp/x/usr/bin/labwc /tmp/mut; then
            echo "verify-globals passed a config that allows virtual pointer"; exit 1
          fi
          dpkg-deb --field dist/eira-labwc.deb Package Version Depends Conflicts Replaces

      - name: Verify the consent agent's window stays on top with focus (R-6.2)
        # As root: the test agent runs with the trusted group as its GID.
        # The script's own control runs prove it can fail.
        run: |
          packaging/eira-labwc/verify-trusted.sh /tmp/x/usr/bin/labwc
          grep -qx 0001-trusted-group-stacking-and-focus.patch /tmp/x/usr/share/eira-labwc/patches

      - name: Upload eira-labwc package
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: eira-labwc-ubuntu-26.04
          path: dist/eira-labwc.deb
          if-no-files-found: error
          retention-days: 14

  # Builds both ISOs and installs the CI image in a KVM virtual machine in the
  # same job, so the CI ISO never leaves the runner (uploading and downloading
  # it cost ~10 minutes). Boots the installed disk and reads the acceptance
  # results (eira-ci-report) from the serial console: daemons, IPC, first
  # boot, GDM login into the EiraOS session, labwc and the EiraOS shell.
  vm-install-acceptance:
    needs: [build-deb, build-eira-labwc]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The job peaks at ~30 GB (base ISO, two ISOs, offline repo). Runners
      # differ: #191 had 91 GB free, #208 (ubuntu-26.04 image, 72 GB disk) had
      # 16 GB and xorriso ran out of space. Clear the preinstalled toolchains
      # this job never uses (~2.5 min) only when there is less than 40 GB free.
      - name: Make sure there is disk space
        run: |
          df -h /
          free_gb=$(df --output=avail -BG / | tail -n 1 | tr -dc '0-9')
          if [ "$free_gb" -lt 40 ]; then
            echo "Only ${free_gb} GB free: removing unused toolchains"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
              /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
              /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft
            df -h /
          fi
          free_gb=$(df --output=avail -BG / | tail -n 1 | tr -dc '0-9')
          if [ "$free_gb" -lt 30 ]; then
            echo "::error::Only ${free_gb} GB free after cleanup; the job needs about 30 GB"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Debian package
        uses: ./.github/actions/download-artifact-retry
        with:
          name: eira-deb-ubuntu-26.04
          path: dist

      - name: Download eira-labwc package
        uses: ./.github/actions/download-artifact-retry
        with:
          name: eira-labwc-ubuntu-26.04
          path: dist

      - name: Install ISO tools
        run: |
          scripts/ci/apt-install.sh xorriso gnupg curl

      # Restored by prefix; saved again only when the verified ISO changed
      # (a point release), not on every run.
      - name: Restore Ubuntu base ISO cache
        id: iso-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/ubuntu-iso
          key: ubuntu-26.04-desktop-none
          restore-keys: ubuntu-26.04-desktop-

      - name: Fetch and verify Ubuntu Desktop 26.04 ISO
        id: base
        run: |
          iso=$(scripts/fetch_ubuntu_iso.sh .cache/ubuntu-iso)
          echo "iso=$iso" >> "$GITHUB_OUTPUT"
          echo "key=ubuntu-26.04-desktop-$(basename "$iso" .iso)-$(stat -c %s "$iso")" >> "$GITHUB_OUTPUT"

      - name: Save Ubuntu base ISO cache
        if: steps.iso-cache.outputs.cache-matched-key != steps.base.outputs.key
        uses: actions/cache/save@v4
        with:
          path: .cache/ubuntu-iso
          key: ${{ steps.base.outputs.key }}

      - name: Build installer ISO and unattended CI ISO
        run: |
          scripts/build_iso.sh --base-iso "${{ steps.base.outputs.iso }}" \
            --deb dist/eira-os-core.deb --labwc-deb dist/eira-labwc.deb --output-dir dist
          # The CI image carries its packages: the VM installs without network.
          EIRA_APT_MIRROR=http://azure.archive.ubuntu.com/ubuntu/ \
            scripts/build_offline_repo.sh --deb dist/eira-os-core.deb --deb dist/eira-labwc.deb \
              --output offline-repo
          scripts/build_iso.sh --base-iso "${{ steps.base.outputs.iso }}" \
            --deb dist/eira-os-core.deb --labwc-deb dist/eira-labwc.deb --output-dir dist \
            --ci-unattended --offline-repo offline-repo

      - name: Verify ISO layout and boot records
        run: |
          for ISO in dist/EiraOS-*-amd64.iso dist/EiraOS-*-amd64-ci-unattended.iso; do
            echo "== $ISO"
            cat "$ISO.sha3-256"
            xorriso -indev "$ISO" -report_el_torito plain 2>/dev/null | tee el-torito.txt
            grep -qi "El Torito boot img" el-torito.txt
            xorriso -indev "$ISO" -report_system_area plain 2>/dev/null | grep -q GPT
            xorriso -indev "$ISO" -find / -type f 2>/dev/null > files.txt
            for f in /autoinstall.yaml /eira/eira-os-core.deb /eira/eira-labwc.deb /eira/eira-postinstall.sh \
                     /eira/eira-firstboot /casper/vmlinuz; do
              grep -q "'$f'" files.txt || { echo "missing $f"; exit 1; }
            done
          done
          ! xorriso -indev dist/EiraOS-*-amd64.iso -find /eira/ci 2>/dev/null | grep -q "'/eira/ci"
          ! xorriso -indev dist/EiraOS-*-amd64.iso -find /eira/repo 2>/dev/null | grep -q "'/eira/repo"
          xorriso -indev dist/EiraOS-*-amd64-ci-unattended.iso -find /eira/repo/Packages.gz 2>/dev/null \
            | grep -q "'/eira/repo/Packages.gz'"

      # The ISO is already compressed (squashfs); zipping it again only costs time.
      - name: Upload installer ISO
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: eira-installer-iso-ubuntu-26.04-amd64
          path: |
            dist/EiraOS-*-amd64.iso
            dist/EiraOS-*-amd64.iso.sha3-256
            dist/EiraOS-*-amd64.iso.build-info.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Make room for the VM disk
        run: |
          rm -rf .cache/ubuntu-iso offline-repo dist/EiraOS-*-amd64.iso
          df -h .

      - name: Install QEMU and enable KVM
        run: |
          scripts/ci/apt-install.sh qemu-system-x86 qemu-utils ovmf socat netpbm swtpm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install EiraOS into a blank disk (UEFI)
        run: |
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
          # cache=unsafe below: the disk is thrown away after the job, and the
          # installer's fsyncs (dpkg, apt) need not reach the runner's disk.
          qemu-img create -f qcow2 disk.qcow2 40G
          mkdir -p screens
          # No network (-nic none): the install must not depend on the Ubuntu
          # archive; the CI image carries what EiraOS needs (/eira/repo).
          # A screenshot every 5 minutes shows where an install stalls.
          ( for n in $(seq -w 1 15); do sleep 300; [ -S qemu-mon.sock ] || break
              echo "screendump screens/install-$n.ppm" | socat - UNIX-CONNECT:qemu-mon.sock >/dev/null 2>&1
              echo "::group::serial console after $((10#$n * 5)) min"
              tr -d '\r' < install-serial.log | strings | tail -n 25
              echo "::endgroup::"
            done ) &
          timeout 75m qemu-system-x86_64 -enable-kvm -monitor unix:qemu-mon.sock,server,nowait -machine q35 -cpu host -smp 4 -m 8192 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file=disk.qcow2,if=virtio,format=qcow2,cache=unsafe \
            -cdrom dist/EiraOS-*-amd64-ci-unattended.iso -boot order=d \
            -device virtio-vga -display none -nic none \
            -serial file:install-serial.log -no-reboot || status=$?
          echo "installer VM exited with ${status:-0} (124 = timeout)"
          tail -c 20000 install-serial.log | tr -d '\r' || true
          for f in screens/*.ppm; do [ -f "$f" ] && pnmtopng "$f" > "${f%.ppm}.png" && rm "$f"; done
          if grep -aq "EIRA-CI INSTALL FAILED" install-serial.log; then
            echo "::group::eira-postinstall.log"
            tr -d '\r' < install-serial.log | sed -n '/---- eira-postinstall.log/,/---- end eira-postinstall.log/p'
            echo "::endgroup::"
            echo "::group::apt errors and target sources"
            tr -d '\r' < install-serial.log | sed -n '/---- apt errors/,/---- end apt/p'
            echo "::endgroup::"
            exit 1
          fi
          [ "${status:-0}" -eq 0 ]

      - name: Boot installed system and run acceptance report
        run: |
          # A software TPM 2.0 for the device key checks (EIRA-CONTEXT §5.0).
          mkdir -p tpm
          swtpm socket --tpm2 --tpmstate dir=tpm --ctrl type=unixio,path=tpm/swtpm.sock --daemon
          timeout 30m qemu-system-x86_64 -enable-kvm -machine q35 -cpu host -smp 4 -m 4096 \
            -chardev socket,id=chrtpm,path=tpm/swtpm.sock -tpmdev emulator,id=tpm0,chardev=chrtpm \
            -device tpm-tis,tpmdev=tpm0 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file=disk.qcow2,if=virtio,format=qcow2,cache=unsafe \
            -device virtio-vga -display none -nic user,model=virtio-net-pci \
            -serial file:boot-serial.log -no-reboot || true
          tr -d '\r' < boot-serial.log | grep -a "EIRA-CI" | tee acceptance.txt
          grep -q "EIRA-CI RESULT PASS" acceptance.txt || { tr -d '\r' < boot-serial.log | tail -n 400; exit 1; }

      - name: Upload serial logs
        if: always()
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: vm-acceptance-logs
          path: |
            install-serial.log
            boot-serial.log
            acceptance.txt
            screens/*.png
          if-no-files-found: ignore
          retention-days: 14

  # The one verdict for a PR (UDVIKLINGSPLAN F0c.1, review G-19). The package
  # is built with nocheck so the ISO is not held up by the test suites; they
  # run in parallel in tests-on-ubuntu-26-04 instead. This job is red unless
  # the tests on 26.04 AND the installed-system acceptance both passed, so a
  # green workflow means "the code is right and it works installed".
  acceptance:
    if: always()
    needs: [build-deb, tests-on-ubuntu-26-04, build-eira-labwc, vm-install-acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: All acceptance jobs passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | python3 -c 'import json,sys; r=json.load(sys.stdin); sys.exit(0 if r and all(x == "success" for x in r) else 1)'
