name: EiraOS CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Create EiraOS IPC group
      run: |
        if ! getent group eira >/dev/null; then
          sudo groupadd eira
        fi

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest ruff alembic pyyaml

    - name: Run Ruff linter
      run: |
        ruff check .

    - name: Install AppArmor parser for packaging validation
      run: |
        sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update
        sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y apparmor-utils xorriso

    - name: Run database migrations (Alembic)
      run: |
        alembic upgrade head

    - name: Run integration tests (Pytest)
      run: |
        python -m pytest tests/

  rust-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up-Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust format check
        run: cargo fmt --check
      - name: Cargo check workspace
        run: cargo check --workspace
      - name: Cargo test workspace
        run: cargo test --workspace -- --nocapture
      # Phase 0 IPC & Event Bus contract (specs/PHASE-0-IPC-EVENT-BUS.md).
      # Behind a feature so the Android/WASM state core stays syscall-free.
      - name: Phase 0 contract tests (eira-core --features ipc-tokio)
        run: |
          cargo clippy -p eira-core --features ipc-tokio --all-targets -- -D warnings
          cargo test -p eira-core --features ipc-tokio -- --nocapture

  # ui/src-tauri is `exclude`d from the root Cargo workspace, so
  # `cargo test --workspace` above never builds or tests it. This job
  # tests the Tauri desktop shell (notably the IPC module) separately.
  rust-tauri-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui/src-tauri/target
          key: tauri-${{ runner.os }}-cargo-${{ hashFiles('ui/src-tauri/Cargo.toml') }}
          restore-keys: tauri-${{ runner.os }}-cargo-
      - name: Install Tauri system dependencies (Linux)
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          # NB: no --locked here: ui/src-tauri/Cargo.lock is gitignored, so
          # --locked would fail with "cannot create the lock file". The root
          # workspace lock does not apply (src-tauri is excluded from it).
      - name: Cargo test ui/src-tauri
        run: cargo test --manifest-path ui/src-tauri/Cargo.toml -- --nocapture

  # Frontend: type check + vitest (incl. tests/e2e_canvas.test.ts). These
  # tests were not run in CI before, so UI regressions went unnoticed.
  ui-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Vitest
        run: npm test
