name: EiraOS CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Create EiraOS IPC group
      run: |
        if ! getent group eira >/dev/null; then
          sudo groupadd eira
        fi

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest ruff pyyaml

    - name: Run Ruff linter
      run: |
        ruff check .

    - name: Install AppArmor parser for packaging validation
      run: |
        scripts/ci/apt-install.sh apparmor-utils xorriso

    - name: Run integration tests (Pytest)
      run: |
        python -m pytest tests/

  # EIRA-CONTEXT N2 (testplan §1): context homes against real storage.
  # MinIO (S3; Chainguard's build, since MinIO stopped publishing
  # minio/minio) and Apache mod_dav (WebDAV) run as containers; moto and
  # WsgiDAV run as a second, independent pair. The mutants live here because
  # the H-1 mutants need the servers.
  context-home:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EIRA_TEST_REQUIRE_SERVERS: "1"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest "moto[server]" wsgidav cheroot
    - name: Start MinIO and Apache WebDAV
      run: |
        docker run -d --name minio -p 9000:9000 \
          -e MINIO_ROOT_USER=eira -e MINIO_ROOT_PASSWORD=eira-secret-key \
          cgr.dev/chainguard/minio:latest server /data
        docker run -d --name webdav -p 8080:80 \
          -e AUTH_TYPE=Basic -e USERNAME=eira -e PASSWORD=eira \
          bytemark/webdav:latest
        for i in $(seq 60); do
          curl -fs http://127.0.0.1:9000/minio/health/live >/dev/null \
            && curl -s -o /dev/null -u eira:eira http://127.0.0.1:8080/ && break
          sleep 1
        done
    - name: H-1 against MinIO and Apache mod_dav
      env:
        EIRA_TEST_S3_NAME: minio
        EIRA_TEST_S3_ENDPOINT: http://127.0.0.1:9000
        EIRA_TEST_S3_ACCESS_KEY: eira
        EIRA_TEST_S3_SECRET_KEY: eira-secret-key
        EIRA_TEST_WEBDAV_NAME: apache-mod_dav
        EIRA_TEST_WEBDAV_URL: http://127.0.0.1:8080
        EIRA_TEST_WEBDAV_USER: eira
        EIRA_TEST_WEBDAV_PASSWORD: eira
      run: python -m pytest -v -p no:cacheprovider -m home tests/context/home -rs
    - name: H-1 against moto and WsgiDAV
      run: python -m pytest -v -p no:cacheprovider -m home tests/context/home -rs
    # EIRA-CONTEXT testplan §2: every mutant must be caught (moto/WsgiDAV).
    - name: Context mutants (EIRA-CONTEXT N1, N2)
      env:
        EIRA_TEST_H1B_REPETITIONS: "5"
      run: PYTHON=python scripts/check-mutants.sh 'CTX-*'
    - name: Server logs
      if: failure()
      run: docker logs minio | tail -50; docker logs webdav | tail -50

  # Gate Kernel and the IPC access classes under mutation (UDVIKLINGSPLAN
  # F0c.2, review G-21): each GATE-*/IPC-* patch is a realistic bug in a
  # security invariant, and some test must fail on it. A mutant that breaks
  # the test run instead (collection error) fails the job too.
  security-mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    - name: Create EiraOS IPC group
      run: getent group eira >/dev/null || sudo groupadd eira
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest pyyaml
    - name: Gate and IPC mutants
      run: PYTHON=python scripts/check-mutants.sh 'GATE-*' 'IPC-*'

  rust-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up-Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust format check
        run: cargo fmt --check
      # Every crate in the workspace (eira-core, eira-ipc, eira-stated,
      # eira-consent-agent), with all features and test/example targets.
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Cargo test workspace
        run: cargo test --workspace -- --nocapture
      # EIRA-CONSENT-AGENT: the agent's window against a real (headless)
      # compositor, and its binary links nothing but libc (R-5.5).
      - name: Consent agent window and linkage
        timeout-minutes: 25
        run: |
          scripts/ci/apt-install.sh weston
          cargo build -p eira-consent-agent --release
          ! ldd target/release/eira-consent-agent | grep -Eq "wayland|xkb|fontconfig|gtk|dbus|webkit"
          cargo build -p eira-consent-agent --features smoke --example window_smoke
          export XDG_RUNTIME_DIR=$(mktemp -d) && chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --renderer=pixman --socket=wayland-ci --width=1280 --height=800 &
          for i in $(seq 1 20); do [ -S "$XDG_RUNTIME_DIR/wayland-ci" ] && break; sleep 0.5; done
          WAYLAND_DISPLAY=wayland-ci timeout 60 target/debug/examples/window_smoke
      # Phase 0 IPC & Event Bus contract (specs/PHASE-0-IPC-EVENT-BUS.md).
      # Behind a feature so the Android/WASM state core stays syscall-free.
      - name: Phase 0 contract tests (eira-core --features ipc-tokio)
        run: |
          cargo test -p eira-core --features ipc-tokio -- --nocapture

  # ui/src-tauri is `exclude`d from the root Cargo workspace, so
  # `cargo test --workspace` above never builds or tests it. This job
  # tests the Tauri desktop shell (notably the IPC module) separately.
  rust-tauri-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Excluded from the root workspace, so the root `cargo fmt --check`
      # does not see it.
      - name: Rust format check ui/src-tauri
        run: cargo fmt --manifest-path ui/src-tauri/Cargo.toml --check
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui/src-tauri/target
          key: tauri-${{ runner.os }}-cargo-${{ hashFiles('ui/src-tauri/Cargo.toml') }}
          restore-keys: tauri-${{ runner.os }}-cargo-
      - name: Install Tauri system dependencies (Linux)
        run: |
          scripts/ci/apt-install.sh libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          # NB: no --locked here: ui/src-tauri/Cargo.lock is gitignored, so
          # --locked would fail with "cannot create the lock file". The root
          # workspace lock does not apply (src-tauri is excluded from it).
      - name: Clippy ui/src-tauri
        run: cargo clippy --manifest-path ui/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Cargo test ui/src-tauri
        run: cargo test --manifest-path ui/src-tauri/Cargo.toml -- --nocapture

  # Frontend: type check + vitest (incl. tests/e2e_canvas.test.ts). These
  # tests were not run in CI before, so UI regressions went unnoticed.
  ui-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Vitest
        run: npm test
