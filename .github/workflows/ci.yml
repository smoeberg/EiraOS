name: EiraOS CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Create EiraOS IPC group
      run: |
        if ! getent group eira >/dev/null; then
          sudo groupadd eira
        fi

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest ruff alembic

    - name: Run Ruff linter
      run: |
        ruff check .

    - name: Run database migrations (Alembic)
      run: |
        alembic upgrade head

    - name: Run integration tests (Pytest)
      run: |
        python -m pytest tests/

  rust-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up-Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust format check
        run: cargo fmt --check
      - name: Cargo check workspace
        run: cargo check --workspace
      - name: Cargo test workspace
        run: cargo test --workspace -- --nocapture

  # ui/src-tauri is `exclude`d from the root Cargo workspace, so
  # `cargo test --workspace` above never builds or tests it. This job
  # tests the Tauri desktop shell (notably the IPC module) separately.
  rust-tauri-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui/src-tauri/target
          key: tauri-${{ runner.os }}-cargo-${{ hashFiles('ui/src-tauri/Cargo.lock') }}
          restore-keys: tauri-${{ runner.os }}-cargo-
      - name: Install Tauri system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Cargo test ui/src-tauri
        run: cargo test --manifest-path ui/src-tauri/Cargo.toml --locked -- --nocapture
