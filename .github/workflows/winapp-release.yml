name: EiraOS WinApp Release (Windows MSI / EXE)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (beta, stable)'
        required: true
        default: 'beta'

jobs:
  build-winapp:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Install frontend dependencies & build
        run: |
          cd ui
          pnpm install
          pnpm build

      - name: Build Tauri App (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: __TAURI_SIGNATURE__ # auto-generate or use tag
          releaseName: 'EiraOS WinApp v__VERSION__'
          releaseBody: 'EiraOS Windows Spatial Desktop Client release.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eira-winapp-artifacts
          path: |
            ui/src-tauri/target/release/bundle/msi/*.msi
            ui/src-tauri/target/release/bundle/nsis/*.exe
