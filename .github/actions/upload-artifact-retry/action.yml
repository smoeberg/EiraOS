name: Upload artifact with retry
description: >
  actions/upload-artifact@v4 with up to three attempts. GitHub's artifact
  service sometimes fails after a green build (11 November 2026); a retry
  overwrites a half-created artifact of the same name (UDVIKLINGSPLAN F1.4).
inputs:
  name:
    description: Artifact name
    required: true
  path:
    description: Files to upload (same syntax as actions/upload-artifact)
    required: true
  if-no-files-found:
    description: warn, error or ignore
    default: warn
  retention-days:
    description: Days to keep the artifact (0 = repository default)
    default: "0"
runs:
  using: composite
  steps:
    - id: first
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
    - if: steps.first.outcome == 'failure'
      shell: bash
      run: echo "::warning::upload of ${{ inputs.name }} failed; retrying in 30 s" && sleep 30
    - id: second
      if: steps.first.outcome == 'failure'
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true
    - if: steps.second.outcome == 'failure'
      shell: bash
      run: echo "::warning::upload of ${{ inputs.name }} failed again; last attempt in 90 s" && sleep 90
    - if: steps.second.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true
