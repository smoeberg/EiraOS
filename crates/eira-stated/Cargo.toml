[package]
name = "eira-stated"
version.workspace = true
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "High-performance immutable SQLite state engine for EiraOS"

[lib]
name = "eira_stated"
crate-type = ["cdylib", "rlib"]

[dependencies]
eira-core = { path = "../eira-core" }
r2d2 = "0.8"
r2d2_sqlite = { version = "0.35", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
