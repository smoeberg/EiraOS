[package]
name = "eira-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Cross-platform EiraOS immutable State hashing and validation"

[lib]
name = "eira_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1.0"
sha3 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
