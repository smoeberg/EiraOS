[package]
name = "eira-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Cross-platform EiraOS immutable State hashing and validation"

[lib]
name = "eira_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Phase 0 IPC & Event Bus contract (docs/specs/PHASE-0-IPC-EVENT-BUS.md).
# Unix only; kept out of the default build so the Android/WASM state core
# does not pull in syscalls or crypto it does not use.
ipc = ["dep:ed25519-dalek", "dep:libc"]
ipc-tokio = ["ipc", "dep:tokio"]

[dependencies]
serde_json = "1.0"
sha3 = "0.10"
ed25519-dalek = { version = "2", optional = true }
libc = { version = "0.2", optional = true }
tokio = { version = "1", optional = true, features = ["net"] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "rt", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
