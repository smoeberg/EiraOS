[package]
name = "eira-spatial-desktop"
version = "0.3.0"
description = "EiraOS Spatial Canvas desktop shell"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[lib]
name = "eira_spatial_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["io-util", "net", "time"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[workspace]
